<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses · Al Murattil</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><div class="shell nav"><a class="brand" href="/"><img src="/logo.png" alt="Al Murattil logo"><span>Al Murattil Quran Institute</span></a><nav class="navlinks"><a href="/">Home</a><a href="/courses">Courses</a><a href="/announcements">Announcement</a><a href="/login">Log in</a><a href="/register">Register</a></nav></div></header><main class="shell"><div class="page-head"><div class="eyebrow">Courses</div><h1>Choose your learning path</h1><p class="lead">Explore the Qur'an learning programmes currently available at Al Murattil Quran Institute.</p></div><div id="courses" class="course-grid"></div></main><footer class="footer"><div class="shell">© 2026 Al Murattil Quran Institute</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/common.js"></script><script>const d=db();$('#courses').innerHTML=d.courses.filter(c=>c.status==='active').map(c=>`<article class="card course-card"><span class="pill">${c.id}</span><h2>${c.name}</h2><p class="muted">${c.length}<br>${c.schedule}<br><strong>${c.fee}</strong></p><a class="btn btn-primary" href="/register?course=${encodeURIComponent(c.id)}">Register</a></article>`).join('')||'<div class="card">No active courses.</div>';</script></body></html>
