<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Workspace | Al Murattil Quran Institute
  </title>

  <link
    rel="stylesheet"
    href="/styles.css">

</head>


<body>

<header class="site-header">

  <div class="header-inner">

    <a href="/" class="brand">

      <img
        src="/logo.png"
        alt="Al Murattil logo">

      <span class="brand-text">
        Al Murattil Quran Institute
      </span>

    </a>


    <nav class="main-nav">

      <a href="/">
        Website
      </a>

      <a href="#" onclick="logout(); return false;">
        Log out
      </a>

    </nav>

  </div>

</header>


<main class="page-shell">

  <section class="workspace-header">

    <div>

      <p class="eyebrow">
        Learning Workspace
      </p>

      <h1>
        Welcome,
        <span id="workspaceUserName"></span>
      </h1>

      <p>
        Account role:
        <strong id="workspaceRole"></strong>
      </p>

    </div>


    <button
      class="button secondary"
      onclick="logout()">

      Log out

    </button>

  </section>


  <div id="workspaceContent">
  </div>

</main>


<footer class="footer">

  <div class="footer-inner">
    © 2026 Al Murattil Quran Institute
  </div>

</footer>


<script src="/common.js"></script>

<script>
  renderWorkspace();
</script>

</body>

</html>
