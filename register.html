<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · Al Murattil</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><div class="shell nav"><a class="brand" href="/"><img src="/logo.png" alt="Al Murattil logo"><span>Al Murattil Quran Institute</span></a><nav class="navlinks"><a href="/">Home</a><a href="/register">Register</a><a href="/login">Log in</a><a href="/announcements">Announcements</a><a href="/courses">Courses</a></nav></div></header>
<main class="shell"><div class="page-head"><div class="eyebrow">Student registration</div><h1>Apply for a course</h1><p class="lead">In this demo, submitted applications appear instantly in the admin workspace for approval.</p></div><form id="registrationForm" class="card form-card"><div class="form-grid"><div class="field"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Date of birth</label><input name="dob" type="date" required></div><div class="field"><label>National ID / Passport</label><input name="national_id" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Guardian name</label><input name="guardian_name"></div><div class="field"><label>Guardian phone</label><input name="guardian_phone"></div><div class="field"><label>Course</label><select name="course_code" id="courseSelect" required><option value="">Select a course</option></select></div><div class="field"><label>Payment method</label><select name="payment_method" required><option value="">Select payment method</option><option value="bank_transfer">Bank transfer</option><option value="online">Online payment</option></select></div><div class="field"><label>Payment reference</label><input name="payment_reference" placeholder="Receipt/reference number" required></div><div class="field full"><label>Additional note</label><textarea name="note" placeholder="Optional"></textarea></div></div><div id="message" class="notice hidden"></div><div class="actions"><button class="btn btn-primary" type="submit">Submit registration</button></div></form></main>
<footer class="footer"><div class="shell">© 2026 Al Murattil Quran Institute · Pre-database demo</div></footer><script src="/common.js"></script><script>
const d=db();const sel=$('#courseSelect');d.courses.filter(c=>c.status==='active').forEach(c=>sel.insertAdjacentHTML('beforeend',`<option value="${c.id}">${c.name}</option>`));const q=new URLSearchParams(location.search).get('course');if(q)sel.value=q;
$('#registrationForm').addEventListener('submit',e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());const d=db();if(d.users.some(x=>x.email.toLowerCase()===body.email.toLowerCase()))return showMessage($('#message'),'An active account already uses this email.','error');const ref=nextReference(d);d.applications.push({id:uid('APP'),reference:ref,...body,status:'pending',submitted_at:new Date().toISOString().slice(0,10)});saveDb(d);showMessage($('#message'),`Application submitted. Your reference is ${ref}. Admin can now see it in the workspace.`,'success');e.target.reset()});
</script></body></html>
