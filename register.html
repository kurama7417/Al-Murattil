<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Register | Al Murattil Quran Institute
  </title>

  <link
    rel="stylesheet"
    href="/styles.css">

</head>


<body>

<header class="site-header">

  <div class="header-inner">

    <a href="/" class="brand">

      <img
        src="/logo.png"
        alt="Al Murattil logo">

      <span class="brand-text">
        Al Murattil Quran Institute
      </span>

    </a>


    <button
      class="mobile-menu-button"
      onclick="toggleMenu()">
      ☰
    </button>


    <nav class="main-nav">

      <a href="/">
        Home
      </a>

      <a href="/courses">
        Course
      </a>

      <a href="/announcements">
        Announcement
      </a>

      <a href="/login">
        Log in
      </a>

      <a
        href="/register"
        class="register-link">
        Register
      </a>

    </nav>

  </div>

</header>


<main class="page-shell">

  <div class="form-container">

    <section class="page-heading">

      <p class="eyebrow">
        Student Registration
      </p>

      <h1>
        Register for a course
      </h1>

      <p class="lead">
        Complete the registration form and select the course
        you would like to join.
      </p>

    </section>


    <section class="form-card">

      <form onsubmit="submitRegistration(event)">

        <div class="form-group">

          <label for="fullName">
            Full name
          </label>

          <input
            id="fullName"
            name="fullName"
            type="text"
            required>

        </div>


        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            required>

        </div>


        <div class="form-group">

          <label for="phone">
            Phone number
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            required>

        </div>


        <div class="form-group">

          <label for="course">
            Course
          </label>

          <select
            id="course"
            name="course"
            required>
          </select>

        </div>


        <div class="form-group">

          <label for="paymentMethod">
            Payment method
          </label>

          <select
            id="paymentMethod"
            name="paymentMethod"
            required>

            <option value="">
              Select payment method
            </option>

            <option value="online">
              Online payment
            </option>

            <option value="bank-transfer">
              Bank transfer
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="paymentReference">
            Payment reference
          </label>

          <input
            id="paymentReference"
            name="paymentReference"
            type="text"
            placeholder="Enter transaction or receipt reference"
            required>

        </div>


        <button type="submit">
          Submit Registration
        </button>


        <div
          id="registrationMessage"
          class="form-message">
        </div>

      </form>

    </section>

  </div>

</main>


<footer class="footer">

  <div class="footer-inner">
    © 2026 Al Murattil Quran Institute
  </div>

</footer>


<script src="/common.js"></script>

<script>
  populateCourseSelect();
</script>

</body>

</html>
