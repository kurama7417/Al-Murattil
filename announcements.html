<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Announcements | Al Murattil Quran Institute
  </title>

  <link
    rel="stylesheet"
    href="/styles.css">

</head>


<body>

<header class="site-header">

  <div class="header-inner">

    <a href="/" class="brand">

      <img
        src="/logo.png"
        alt="Al Murattil logo">

      <span class="brand-text">
        Al Murattil Quran Institute
      </span>

    </a>


    <button
      class="mobile-menu-button"
      onclick="toggleMenu()">
      ☰
    </button>


    <nav class="main-nav">

      <a href="/">
        Home
      </a>

      <a href="/courses">
        Course
      </a>

      <a
        href="/announcements"
        class="active">
        Announcement
      </a>

      <a href="/login">
        Log in
      </a>

      <a
        href="/register"
        class="register-link">
        Register
      </a>

    </nav>

  </div>

</header>


<main class="page-shell">

  <section class="page-heading">

    <p class="eyebrow">
      Institute Updates
    </p>

    <h1>
      Announcements
    </h1>

    <p class="lead">
      View important notices, course updates and information
      from Al Murattil Quran Institute.
    </p>

  </section>


  <section
    id="announcementList"
    class="announcement-list">
  </section>

</main>


<footer class="footer">

  <div class="footer-inner">
    © 2026 Al Murattil Quran Institute
  </div>

</footer>


<script src="/common.js"></script>

<script>
  renderAnnouncements("announcementList");
</script>

</body>

</html>
